name: CI

on:
  push:
    branches: [main, deploy/vps]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Ruff lint (F / E9 — 实际 bug 与语法)
        run: ruff check . --select F,E9
      - name: Pytest
        # 测试在仓库根目录 tests/，且需 backend 在 sys.path 上（test_broker_reconcile 等直接 import 后端模块）
        working-directory: .
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (build + vitest + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Production dependency audit (0 vulnerabilities enforced)
        run: npm audit --omit=dev