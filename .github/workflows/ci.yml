name: CI

on:
  push:
    branches: [main, deploy/vps]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # action 自身也升到 v7：checkout@v4 / setup-python@v5 跑在 Node 20 runtime，
      # GitHub 强制在 24 上跑并每次 CI 打 deprecation annotation。用法不变。
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Ruff lint (F / E9 — 实际 bug 与语法)
        # tests/ 在仓库根：若沿用 job 的 working-directory=backend 就永远扫不到它，
        # F821（f-string 里误用变量）这类只在断言失败时才炸的问题会一直潜伏。
        working-directory: .
        run: ruff check backend tests --select F,E9
      - name: Pytest
        # 测试在仓库根目录 tests/，且需 backend 在 sys.path 上（test_broker_reconcile 等直接 import 后端模块）
        working-directory: .
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (build + vitest + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 → undici 8 声明 engines: node >=22.19。CI 原先跑 Node 20，
          # vitest 的 21 个文件在启动阶段就 TypeError（webidl.util.markAsUncloneable
          # 在旧 Node 上不存在），表现为「0 用例 + 21 errors」。与本地/Docker 统一到 22。
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Production dependency audit (0 vulnerabilities enforced)
        run: npm audit --omit=dev

  desktop:
    name: Desktop shell (cargo check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # tauri-build 会校验 externalBin 与 resources 声明的路径是否真的存在：干净 clone 里
      # src-tauri/binaries/ 被 gitignore、frontend/dist 也得先构建过，两样都缺时 cargo check
      # 直接以「resource path ... doesn't exist」失败。这里只放空文件与空目录占位
      # （cargo check 不读内容），真正的产物仍由 scripts/build-desktop.sh 打。
      - name: 准备 cargo check 需要的路径占位
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p frontend/dist src-tauri/binaries
          : > "src-tauri/binaries/invest-tracker-backend-$triple"
          echo "target triple: $triple"
      - name: 校验 tauri.conf.json 语法
        run: python3 -c "import json; json.load(open('src-tauri/tauri.conf.json')); print('tauri.conf.json ok')"
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked